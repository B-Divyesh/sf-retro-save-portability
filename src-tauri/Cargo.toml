[package]
name = "retro-save-portability"
version = "0.1.0"
description = "Inspect, bundle, and safely restore retro game saves"
authors = ["Param Factory"]
license = "MIT"
edition = "2021"

[lib]
name = "retro_save_portability_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "retro-save-portability"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
